<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/contato.css">
  <link rel="icon" type="image/x-icon" href="img/icon.ico">

  <title>Portal Turma do Bem</title>

</head>

<body>
  <header>
    <img src="./Img/logo.png" alt="Logo da Turma do Bem" class="logo">

    <nav class="menu-centro">
      <ul>
        <li><a href="./index.html">Home</a></li>
        <li><a href="./quemSomos.html">Quem Somos</a></li>
        <li><a href="./sobre.html">Sobre</a></li>
        <li><a href="./faq.html">FAQ</a></li>
        <li><a href="./contato.html" class="ativo">Contato</a></li>
      </ul>

    </nav>
    <div class="botoes-direita">
      <button>Entrar no Portal </button>
      <img src="./Img/iconePerfil.png" alt="Icone de Perfil" class="icon">
    </div>

  </header>

  <main>
    <section class="envie-sua-mensagem">
      <h1>Envie sua mensagem!</h1>
    </section>
    <article class="formularioDiv">
      <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="motivo">Motivo:</label>
        <select id="motivo" name="motivo" required>
          <option value="">Selecione um motivo</option>
          <option value="duvida">Dúvida</option>
          <option value="sugestao">Sugestão</option>
          <option value="elogio">Elogio</option>
          <option value="reclamacao">Reclamação</option>
        </select>
        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="4" required></textarea>
        <div id="botoes">
          <button type="submit" class="buttonSubmit">Enviar</button>
          <button type="reset" class="buttonReset">Limpar</button>
        </div>
      </form>
    </article>
  </main>


  <footer>
    <p>© 2026 Projeto Turma do Bem | FIAP</p>
  </footer>

</body>

</html>
